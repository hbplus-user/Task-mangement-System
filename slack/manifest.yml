# HB+ Tasks — Slack app manifest (PRD §11)
# Slack → https://api.slack.com/apps → Create New App → From a manifest → pick the HB+ workspace → paste this.
display_information:
  name: HB+ Tasks
  description: Daily SOW, task ownership and follow-ups for the HB+ team.
  background_color: "#53372b"
features:
  bot_user:
    display_name: HB+ Tasks
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  slash_commands:
    - command: /task
      url: https://dbljeylvmngihvlltydj.supabase.co/functions/v1/hb-slack
      description: Create, open or bulk-add HB+ tasks
      usage_hint: "[title] · [task ID, e.g. MKT-14] · bulk · help"
      should_escape: false
  shortcuts:
    - name: Create HB+ task
      type: message
      callback_id: create_task_from_message
      description: Turn this message into an HB+ task
oauth_config:
  scopes:
    bot:
      - chat:write          # send DMs and posts
      - chat:write.public   # post to #credits-where-credits-due without joining
      - im:write            # open DMs with people
      - users:read          # match people
      - users:read.email    # match Slack users to HB+ users by email
      - commands            # /task and the message shortcut
settings:
  interactivity:
    is_enabled: true
    request_url: https://dbljeylvmngihvlltydj.supabase.co/functions/v1/hb-slack
  socket_mode_enabled: false
  token_rotation_enabled: false
